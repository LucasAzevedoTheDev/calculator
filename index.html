<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Trirong">
  <script src="scripts.js" defer></script> 
</head>
<body>
  <div class="calculator">
    <div class="display"></div>
    <div class="keyboard">
      <button class="buttons clear del">DEL</button>
      <button class="buttons clear ac">AC</button>
      <button class="buttons operator percent">%</button>
      <button class="buttons operator divisor">÷</button>
      <button class="buttons number seven">7</button>
      <button class="buttons number eight">8</button>
      <button class="buttons number nine">9</button>
      <button class="buttons operator multiply">x</button>
      <button class="buttons number four">4</button>
      <button class="buttons number five">5</button>
      <button class="buttons number six">6</button>
      <button class="buttons operator minus">-</button>
      <button class="buttons number one">1</button>
      <button class="buttons number two">2</button>
      <button class="buttons number three">3</button>
      <button class="buttons operator plus">+</button>
      <button class="buttons number zero">0</button>
      <button class="buttons point">.</button>
      <button class="buttons equal">=</button>
    </div>
  </div>
</body>
</html>
